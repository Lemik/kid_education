<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kid Money Practice</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app">
    <nav class="tabs" id="subjectNav" aria-label="Subjects">
      <a class="tab" href="../math/">Mathematics</a>
      <a class="tab" href="../measure/">Measurements</a>
      <a class="tab" href="../patterns/">Patterns</a>
      <a class="tab" href="../words/">Words</a>
      <a class="tab" href="../unscramble/">Unscramble</a>
      <a class="tab" href="../sentences/">Sentences</a>
      <a class="tab" href="../clock/">Clock</a>
      <a class="tab active" href="../money/" aria-current="page">Money</a>
      <a class="tab" href="../geography/">Geography</a>
    </nav>
    <header class="top-bar">
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Subjects menu" aria-expanded="false" aria-controls="subjectNav">?</button>
      <div class="timer-wrap" id="timerWrap" hidden>
        <span class="timer-label">Time</span>
        <span class="timer" id="timer" aria-live="polite">00:00</span>
      </div>
      <div class="top-bar-spacer"></div>
      <div class="score-wrap">
        <span class="score-label">Score</span>
        <span class="score" id="score" aria-live="polite">0</span>
      </div>
      <div class="score-wrap wrong-wrap" id="wrongWrap" hidden>
        <span class="score-label">Wrong</span>
        <span class="score wrong" id="wrongScore" aria-live="polite">0</span>
      </div>
      <button type="button" class="settings-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        ⚙
      </button>
    </header>

    <main class="main">
      <div class="money-question" id="moneyQuestion" aria-live="polite">Loading…</div>

      <div class="answer-area" id="answerArea">
        <div class="typed-answer" id="typedAnswer" hidden>
          <label class="sr-only" for="answerInput">Your answer in cents</label>
          <input
            type="number"
            id="answerInput"
            class="answer-input"
            inputmode="numeric"
            autocomplete="off"
            placeholder="¢"
            min="0"
            step="1"
          />
          <button type="button" class="btn btn-primary" id="submitBtn">Submit</button>
        </div>

        <div class="choices" id="choices" hidden></div>
      </div>

      <p class="feedback" id="feedback" aria-live="assertive"></p>
    </main>
  </div>

  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
      <h2 id="settingsTitle">Settings</h2>

      <form id="settingsForm" class="settings-form">
        <fieldset class="field">
          <legend>Question types</legend>
          <div class="checkbox-row">
            <label><input type="checkbox" name="type" value="count" /> Count coins</label>
            <label><input type="checkbox" name="type" value="compare" /> Compare A vs B</label>
            <label><input type="checkbox" name="type" value="equation" /> Word equation</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Coins</legend>
          <div class="checkbox-row">
            <label><input type="checkbox" name="coins" value="nickel" /> Nickel (5¢)</label>
            <label><input type="checkbox" name="coins" value="dime" /> Dime (10¢)</label>
            <label><input type="checkbox" name="coins" value="quarter" /> Quarter (25¢)</label>
            <label><input type="checkbox" name="coins" value="loonie" /> Loonie ($1)</label>
            <label><input type="checkbox" name="coins" value="toonie" /> Toonie ($2)</label>
          </div>
        </fieldset>

        <label class="field">
          <span>Max coins per type</span>
          <select name="maxCoins" id="settingMaxCoins">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>

        <label class="field">
          <span>Max total</span>
          <select name="maxTotal" id="settingMaxTotal">
            <option value="50">50¢</option>
            <option value="100">100¢</option>
            <option value="200">200¢</option>
            <option value="500">500¢</option>
          </select>
        </label>

        <fieldset class="field">
          <legend>Show results</legend>
          <div class="radio-row">
            <label><input type="radio" name="sign" value="positive" /> Positive</label>
            <label><input type="radio" name="sign" value="both" /> Both</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Time</legend>
          <div class="radio-row">
            <label><input type="radio" name="time" value="y" /> Yes</label>
            <label><input type="radio" name="time" value="n" /> No</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Answer mode</legend>
          <div class="radio-row">
            <label><input type="radio" name="input" value="answer" /> Type answer</label>
            <label><input type="radio" name="input" value="multichoice" /> Multiple choice</label>
          </div>
          <p class="field-hint">Compare questions always use A / B / Same buttons.</p>
        </fieldset>

        <p class="form-error" id="settingsError" hidden></p>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelSettingsBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="goBtn">Go</button>
        </div>
      </form>
    </div>
  </div>

  <div class="nav-backdrop" id="navBackdrop" hidden></div>

  <script type="module" src="../js/nav.js"></script>
  <script type="module" src="../js/money-app.js"></script>
</body>
</html>
