<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kid Flags Practice</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app">
    <nav class="tabs" id="subjectNav" aria-label="Subjects">
      <a class="tab tab-home" href="../">Home</a>
      <a class="tab" href="../math/">Mathematics</a>
      <a class="tab" href="../times/">Times Tables</a>
      <a class="tab" href="../subset/">Subset</a>
      <a class="tab" href="../measure/">Measurements</a>
      <a class="tab" href="../patterns/">Patterns</a>
      <a class="tab" href="../words/">Words</a>
      <a class="tab" href="../unscramble/">Unscramble</a>
      <a class="tab" href="../sentences/">Sentences</a>
      <a class="tab" href="../clock/">Clock</a>
      <a class="tab" href="../money/">Money</a>
      <a class="tab" href="../geography/">Geography</a>
      <a class="tab active" href="../flags/" aria-current="page">Flags</a>
      <a class="tab" href="../match/">Find a Match</a>
      <a class="tab" href="../latin/">Latin Square</a>
    </nav>
    <header class="top-bar">
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Subjects menu" aria-expanded="false" aria-controls="subjectNav">☰</button>
      <a class="home-btn" href="../">← Home</a>
      <div class="timer-wrap" id="timerWrap" hidden>
        <span class="timer-label">Time</span>
        <span class="timer" id="timer" aria-live="polite">00:00</span>
      </div>
      <div class="top-bar-spacer"></div>
      <div class="score-wrap">
        <span class="score-label">Score</span>
        <span class="score" id="score" aria-live="polite">0</span>
      </div>
      <div class="score-wrap wrong-wrap" id="wrongWrap">
        <span class="score-label">Wrong</span>
        <span class="score wrong" id="wrongScore" aria-live="polite">0</span>
      </div>
      <button type="button" class="settings-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        ⚙
      </button>
    </header>

    <main class="main">
      <div class="flag-prompt" id="prompt" aria-live="polite">Loading…</div>

      <div class="answer-area" id="answerArea">
        <div class="choices" id="choices" hidden></div>

        <div class="flag-match-board" id="matchBoard" hidden>
          <div class="flag-match-col" id="matchFlags" aria-label="Flags"></div>
          <div class="flag-match-col" id="matchNames" aria-label="Countries"></div>
        </div>
      </div>

      <p class="feedback" id="feedback" aria-live="assertive"></p>
    </main>
  </div>

  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
      <h2 id="settingsTitle">Settings</h2>

      <form id="settingsForm" class="settings-form">
        <fieldset class="field">
          <legend>Game</legend>
          <div class="radio-row">
            <label><input type="radio" name="mode" value="flag" /> Guess the country</label>
            <label><input type="radio" name="mode" value="name" /> Guess the flag</label>
            <label><input type="radio" name="mode" value="match" /> Match</label>
            <label><input type="radio" name="mode" value="mixed" /> Mixed</label>
          </div>
        </fieldset>

        <label class="field">
          <span>Countries</span>
          <select name="region" id="settingRegion">
            <option value="popular">Popular</option>
            <option value="world">Whole world</option>
            <option value="europe">Europe</option>
            <option value="asia">Asia</option>
            <option value="africa">Africa</option>
            <option value="americas">Americas</option>
            <option value="oceania">Oceania</option>
          </select>
        </label>

        <label class="field" id="pairsField">
          <span>Pairs on the board</span>
          <select name="pairs" id="settingPairs">
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="8">8</option>
          </select>
        </label>

        <fieldset class="field">
          <legend>Time</legend>
          <div class="radio-row">
            <label><input type="radio" name="time" value="y" /> Yes</label>
            <label><input type="radio" name="time" value="n" /> No</label>
          </div>
        </fieldset>

        <p class="form-error" id="settingsError" hidden></p>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelSettingsBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="goBtn">Go</button>
        </div>
      </form>
    </div>
  </div>

  <div class="nav-backdrop" id="navBackdrop" hidden></div>

  <script type="module" src="../js/nav.js"></script>
  <script type="module" src="../js/flags-app.js"></script>
</body>
</html>
