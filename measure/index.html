<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kid Measurements Practice</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app">
    <nav class="tabs" id="subjectNav" aria-label="Subjects">
      <a class="tab" href="../math/">Mathematics</a>
      <a class="tab active" href="../measure/" aria-current="page">Measurements</a>
      <a class="tab" href="../patterns/">Patterns</a>
      <a class="tab" href="../words/">Words</a>
      <a class="tab" href="../unscramble/">Unscramble</a>
      <a class="tab" href="../sentences/">Sentences</a>
      <a class="tab" href="../clock/">Clock</a>
      <a class="tab" href="../money/">Money</a>
      <a class="tab" href="../geography/">Geography</a>
    </nav>
    <header class="top-bar">
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Subjects menu" aria-expanded="false" aria-controls="subjectNav">?</button>
      <div class="timer-wrap" id="timerWrap" hidden>
        <span class="timer-label">Time</span>
        <span class="timer" id="timer" aria-live="polite">00:00</span>
      </div>
      <div class="top-bar-spacer"></div>
      <div class="score-wrap">
        <span class="score-label">Score</span>
        <span class="score" id="score" aria-live="polite">0</span>
      </div>
      <div class="score-wrap wrong-wrap" id="wrongWrap" hidden>
        <span class="score-label">Wrong</span>
        <span class="score wrong" id="wrongScore" aria-live="polite">0</span>
      </div>
      <button type="button" class="settings-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        ?
      </button>
    </header>

    <main class="main">
      <div class="equation" id="equation" aria-live="polite">Loading�</div>

      <div class="answer-area" id="answerArea">
        <div class="typed-answer" id="typedAnswer" hidden>
          <label class="sr-only" for="answerInput">Your answer</label>
          <input
            type="number"
            id="answerInput"
            class="answer-input"
            inputmode="numeric"
            autocomplete="off"
            placeholder="?"
          />
          <button type="button" class="btn btn-primary" id="submitBtn">Submit</button>
        </div>

        <div class="choices" id="choices" hidden></div>
      </div>

      <p class="feedback" id="feedback" aria-live="assertive"></p>
    </main>
  </div>

  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
      <h2 id="settingsTitle">Settings</h2>

      <form id="settingsForm" class="settings-form">
        <fieldset class="field">
          <legend>Unit system</legend>
          <div class="radio-row">
            <label><input type="radio" name="sys" value="metric" /> Metric</label>
            <label><input type="radio" name="sys" value="us" /> US</label>
            <label><input type="radio" name="sys" value="time" /> Time</label>
            <label><input type="radio" name="sys" value="both" /> All</label>
          </div>
        </fieldset>

        <fieldset class="field" id="metricPairs">
          <legend>Metric pairs</legend>
          <div class="checkbox-row">
            <label><input type="checkbox" name="pairs" value="mm-cm" /> mm ? cm</label>
            <label><input type="checkbox" name="pairs" value="cm-m" /> cm ? m</label>
            <label><input type="checkbox" name="pairs" value="m-km" /> m ? km</label>
            <label><input type="checkbox" name="pairs" value="g-kg" /> g ? kg</label>
            <label><input type="checkbox" name="pairs" value="mL-L" /> mL ? L</label>
          </div>
        </fieldset>

        <fieldset class="field" id="usPairs">
          <legend>US pairs</legend>
          <div class="checkbox-row">
            <label><input type="checkbox" name="pairs" value="in-ft" /> in ? ft</label>
            <label><input type="checkbox" name="pairs" value="ft-yd" /> ft ? yd</label>
            <label><input type="checkbox" name="pairs" value="oz-lb" /> oz ? lb</label>
          </div>
        </fieldset>

        <fieldset class="field" id="timePairs">
          <legend>Time pairs</legend>
          <div class="checkbox-row">
            <label><input type="checkbox" name="pairs" value="min-hr" /> min ? hour</label>
            <label><input type="checkbox" name="pairs" value="hr-day" /> hour ? day</label>
            <label><input type="checkbox" name="pairs" value="day-week" /> day ? week</label>
            <label><input type="checkbox" name="pairs" value="day-month" /> day ? month (30)</label>
            <label><input type="checkbox" name="pairs" value="day-year" /> day ? year (365)</label>
            <label><input type="checkbox" name="pairs" value="month-year" /> month ? year</label>
            <label><input type="checkbox" name="pairs" value="week-year" /> week ? year (52)</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Question type</legend>
          <div class="radio-row">
            <label><input type="radio" name="mode" value="fact" /> Facts (1 unit)</label>
            <label><input type="radio" name="mode" value="convert" /> Convert amounts</label>
            <label><input type="radio" name="mode" value="both" /> Facts + convert</label>
            <label><input type="radio" name="mode" value="all" /> Facts + convert + reverse</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Direction</legend>
          <div class="radio-row">
            <label><input type="radio" name="dir" value="large-to-small" /> Large ? small</label>
            <label><input type="radio" name="dir" value="small-to-large" /> Small ? large</label>
            <label><input type="radio" name="dir" value="mixed" /> Mixed</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Amounts</legend>
          <div class="radio-row">
            <label><input type="radio" name="qty" value="1" /> Always 1</label>
            <label><input type="radio" name="qty" value="easy" /> Easy (2�10)</label>
            <label><input type="radio" name="qty" value="mixed" /> Mixed (1�10)</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Show results</legend>
          <div class="radio-row">
            <label><input type="radio" name="sign" value="positive" /> Positive</label>
            <label><input type="radio" name="sign" value="both" /> Both</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Time</legend>
          <div class="radio-row">
            <label><input type="radio" name="time" value="y" /> Yes</label>
            <label><input type="radio" name="time" value="n" /> No</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Answer mode</legend>
          <div class="radio-row">
            <label><input type="radio" name="input" value="answer" /> Type answer</label>
            <label><input type="radio" name="input" value="multichoice" /> Multiple choice</label>
          </div>
        </fieldset>

        <p class="form-error" id="settingsError" hidden></p>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelSettingsBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="goBtn">Go</button>
        </div>
      </form>
    </div>
  </div>

  <div class="nav-backdrop" id="navBackdrop" hidden></div>

  <script type="module" src="../js/nav.js"></script>
  <script type="module" src="../js/measure-app.js"></script>
</body>
</html>
