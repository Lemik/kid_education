<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kid Find a Match</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app">
    <nav class="tabs" id="subjectNav" aria-label="Subjects">
      <a class="tab tab-home" href="../">Home</a>
      <a class="tab" href="../math/">Mathematics</a>
      <a class="tab" href="../times/">Times Tables</a>
      <a class="tab" href="../subset/">Subset</a>
      <a class="tab" href="../measure/">Measurements</a>
      <a class="tab" href="../patterns/">Patterns</a>
      <a class="tab" href="../words/">Words</a>
      <a class="tab" href="../unscramble/">Unscramble</a>
      <a class="tab" href="../sentences/">Sentences</a>
      <a class="tab" href="../clock/">Clock</a>
      <a class="tab" href="../money/">Money</a>
      <a class="tab" href="../geography/">Geography</a>
      <a class="tab" href="../flags/">Flags</a>
      <a class="tab active" href="../match/" aria-current="page">Find a Match</a>
      <a class="tab" href="../latin/">Latin Square</a>
      <a class="tab" href="../llama/">Find a Llama</a>
    </nav>
    <header class="top-bar">
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Subjects menu" aria-expanded="false" aria-controls="subjectNav">☰</button>
      <a class="home-btn" href="../">← Home</a>
      <div class="timer-wrap" id="timerWrap" hidden>
        <span class="timer-label">Time</span>
        <span class="timer" id="timer" aria-live="polite">00:00</span>
      </div>
      <div class="top-bar-spacer"></div>
      <div class="score-wrap">
        <span class="score-label">Found</span>
        <span class="score" id="score" aria-live="polite">0 / 0</span>
      </div>
      <div class="match-help">
        <button type="button" class="match-help-btn" id="helpBtn" aria-label="How to play" aria-expanded="false" aria-controls="matchPrompt">i</button>
        <p class="match-prompt" id="matchPrompt" hidden>Flip a card, then another.</p>
      </div>
      <button type="button" class="settings-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        ⚙
      </button>
    </header>

    <main class="main match-main">
      <div class="match-board" id="matchBoard" role="group" aria-label="Cards"></div>
    </main>
  </div>

  <div class="match-sign" id="matchSign" hidden>
    <div class="match-sign-card" id="matchSignCard" role="status" aria-live="assertive">
      <p class="match-sign-emoji" id="matchSignEmoji" aria-hidden="true">🎉</p>
      <h2 class="match-sign-title" id="matchSignTitle">Congratulations!</h2>
      <p class="match-sign-detail" id="matchSignDetail"></p>
      <button type="button" class="btn btn-primary" id="playAgainBtn">Play again</button>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
      <h2 id="settingsTitle">Settings</h2>

      <form id="settingsForm" class="settings-form">
        <label class="field">
          <span>Number of cards</span>
          <input type="number" name="cards" id="settingCards" min="6" max="100" step="2" inputmode="numeric" required />
          <p class="field-hint">Even numbers from 6 to 100. Every card has a match.</p>
        </label>

        <fieldset class="field">
          <legend>Show</legend>
          <div class="checkbox-row">
            <label><input type="checkbox" name="kind" value="pic" /> Pictures</label>
            <label><input type="checkbox" name="kind" value="num" /> Numbers</label>
            <label><input type="checkbox" name="kind" value="word" /> Words</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Mix</legend>
          <div class="radio-row">
            <label><input type="radio" name="mix" value="y" /> Yes</label>
            <label><input type="radio" name="mix" value="n" /> No</label>
          </div>
          <p class="field-hint" id="mixHint"></p>
        </fieldset>

        <fieldset class="field">
          <legend>Timer</legend>
          <div class="radio-row">
            <label><input type="radio" name="time" value="y" /> Yes</label>
            <label><input type="radio" name="time" value="n" /> No</label>
          </div>
        </fieldset>

        <label class="field" id="timeLimitField">
          <span>Time limit</span>
          <select name="limit" id="settingLimit">
            <option value="15">15 seconds</option>
            <option value="30">30 seconds</option>
            <option value="60">1 minute</option>
            <option value="120">2 minutes</option>
            <option value="180">3 minutes</option>
            <option value="300">5 minutes</option>
            <option value="600">10 minutes</option>
          </select>
          <p class="field-hint">Counts down. If time runs out, you see how many pairs you found.</p>
        </label>

        <p class="form-error" id="settingsError" hidden></p>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelSettingsBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="goBtn">Go</button>
        </div>
      </form>
    </div>
  </div>

  <div class="nav-backdrop" id="navBackdrop" hidden></div>

  <script type="module" src="../js/nav.js"></script>
  <script type="module" src="../js/match-app.js"></script>
</body>
</html>
